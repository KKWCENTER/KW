
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>K.W.CENTER | ประกาศผลคะแนน</title>

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="header">

        <div class="header-container">

            <div class="brand">

                <div class="brand-icon">
    <img src="LOGO.png" alt="K.W.CENTER">
</div>

                <div class="brand-text">

                    <h1>K.W.CENTER</h1>

                    <p>โรงเรียนกวดวิชาแก่นวิทย์</p>

                </div>

            </div>

        </div>

    </header>



    <!-- ==========================================
         MAIN
    =========================================== -->

    <main class="main">

        <section class="hero">

            <div class="hero-badge">
                📊 SCORE REPORT
            </div>

            <h2>
                ประกาศผลคะแนน
            </h2>

            <p class="hero-description">
                ตรวจสอบผลคะแนนการทดสอบ
                นักเรียนระดับชั้น ป.6
            </p>


            <!-- ==================================
                 SEARCH CARD
            =================================== -->

            <div class="search-card">


                <!-- EXAM -->

                <div class="form-group">

                    <label for="examSelect">
                        เลือกการสอบ
                    </label>

                    <select id="examSelect">

                        <option value="">
                            กำลังโหลดข้อมูล...
                        </option>

                    </select>

                </div>


                <!-- NAME -->

                <div class="form-group">

                    <label for="nameInput">
                        ค้นหาชื่อนักเรียน
                    </label>

                    <div class="search-input-wrapper">

                        <span class="search-icon">
                            🔍
                        </span>

                        <input
                            type="text"
                            id="nameInput"
                            placeholder="พิมพ์ชื่อหรือชื่อเล่น..."
                            autocomplete="off"
                        >

                    </div>

                    <!-- SEARCH SUGGESTIONS -->

                    <div
                        id="suggestions"
                        class="suggestions"
                    ></div>

                </div>


                <!-- SEARCH BUTTON -->

                <button
                    id="searchButton"
                    class="search-button"
                >

                    <span>
                        🔎
                    </span>

                    ค้นหาคะแนน

                </button>


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="message"
                ></div>


            </div>

        </section>



        <!-- ==========================================
             RESULT AREA
        =========================================== -->

        <section
            id="resultSection"
            class="result-section hidden"
        >

            <!-- Result will be generated
                 by JavaScript -->

        </section>

    </main>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="footer">

        <p>
            © 2026 K.W.CENTER
        </p>

        <p>
            โรงเรียนกวดวิชาแก่นวิทย์
        </p>

    </footer>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="script.js"></script>

</body>

</html>
